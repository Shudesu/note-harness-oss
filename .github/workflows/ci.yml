name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages (types used by apps)
        run: pnpm --filter @note-harness/shared build
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Test
        run: pnpm -r --if-present test
